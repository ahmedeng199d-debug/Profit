<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>NQTRT - Profit Consistency Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:
    radial-gradient(circle at top,#1a1a1a 0%,#0b0b0b 40%,#050505 100%);
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

.backgroundLogo{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:220px;
    font-weight:800;
    color:rgba(255,255,255,0.03);
    pointer-events:none;
    user-select:none;
    letter-spacing:20px;
    z-index:0;
}

.container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:40px 20px;
}

.topBar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

.logo{
    display:flex;
    flex-direction:column;
}

.logo h1{
    font-size:42px;
    font-weight:800;
    background:linear-gradient(90deg,#ffffff,#ffd86f);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo span{
    color:#8f8f8f;
    margin-top:4px;
}

.status{
    padding:14px 22px;
    border-radius:16px;
    font-weight:700;
    font-size:15px;
    transition:0.3s;
}

.pass{
    background:rgba(0,255,128,0.12);
    color:#00ff99;
    border:1px solid rgba(0,255,128,0.25);
    box-shadow:0 0 20px rgba(0,255,128,0.15);
}

.fail{
    background:rgba(255,50,80,0.12);
    color:#ff4d73;
    border:1px solid rgba(255,50,80,0.25);
    box-shadow:0 0 20px rgba(255,50,80,0.15);
}

.mainCard{
    background:rgba(20,20,20,0.82);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:32px;
    padding:35px;
    box-shadow:
    0 0 60px rgba(0,0,0,0.45),
    inset 0 0 0 1px rgba(255,255,255,0.02);
}

.sectionTitle{
    font-size:24px;
    font-weight:700;
    margin-bottom:28px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
}

.box{
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:24px;
    padding:22px;
    transition:0.3s;
}

.box:hover{
    border-color:rgba(255,216,111,0.25);
    transform:translateY(-2px);
}

.label{
    color:#979797;
    font-size:14px;
    margin-bottom:12px;
    display:block;
}

.input{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:white;
    font-size:30px;
    font-weight:700;
}

.input::placeholder{
    color:#444;
}

.resultArea{
    margin-top:40px;
}

.resultTop{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.resultTop h2{
    font-size:26px;
}

.percent{
    font-size:34px;
    font-weight:800;
}

.progressContainer{
    position:relative;
    width:100%;
    height:28px;
    background:#1d1d1d;
    border-radius:50px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.04);
}

.progress{
    height:100%;
    width:0%;
    transition:0.4s ease;
    border-radius:50px;
    background:
    linear-gradient(
    90deg,
    #00ff95 0%,
    #ffe26f 45%,
    #ff3d64 100%);
}

.targetLine{
    position:absolute;
    top:0;
    bottom:0;
    width:3px;
    background:white;
    left:20%;
    opacity:0.9;
}

.stats{
    margin-top:32px;
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

.stat{
    background:rgba(255,255,255,0.03);
    border-radius:24px;
    padding:24px;
    border:1px solid rgba(255,255,255,0.05);
}

.statLabel{
    color:#909090;
    font-size:14px;
    margin-bottom:12px;
}

.statValue{
    font-size:34px;
    font-weight:800;
}

.footer{
    margin-top:30px;
    text-align:center;
    color:#666;
    font-size:13px;
}

.footer strong{
    color:#d8d8d8;
}

.glow{
    position:fixed;
    width:400px;
    height:400px;
    background:#ffcc55;
    filter:blur(160px);
    opacity:0.07;
    border-radius:50%;
    top:-100px;
    right:-100px;
    z-index:0;
}

@media(max-width:900px){

    .grid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .topBar{
        flex-direction:column;
        align-items:flex-start;
        gap:18px;
    }

    .logo h1{
        font-size:34px;
    }

    .percent{
        font-size:28px;
    }

    .backgroundLogo{
        font-size:120px;
    }

}

</style>
</head>

<body>

<div class="backgroundLogo">NQTRT</div>
<div class="glow"></div>

<div class="container">

<div class="topBar">

<div class="logo">
    <h1>NQTRT</h1>
    <span>Profit Consistency Calculator</span>
</div>

<div id="status" class="status fail">
    NOT PASSING
</div>

</div>

<div class="mainCard">

<div class="sectionTitle">
Trading Metrics
</div>

<div class="grid">

<div class="box">
    <label class="label">Current Total Profit ($)</label>
    <input type="number" id="totalProfit" class="input" placeholder="1000">
</div>

<div class="box">
    <label class="label">Largest Winning Day ($)</label>
    <input type="number" id="largestDay" class="input" placeholder="400">
</div>

<div class="box">
    <label class="label">Target Consistency (%)</label>
    <input type="number" id="target" class="input" placeholder="20">
</div>

<div class="box">
    <label class="label">Average Daily Profit ($)</label>
    <input type="number" id="dailyProfit" class="input" placeholder="100">
</div>

</div>

<div class="resultArea">

<div class="resultTop">
    <h2>Consistency Level</h2>
    <div class="percent" id="percent">0%</div>
</div>

<div class="progressContainer">
    <div class="targetLine" id="targetLine"></div>
    <div class="progress" id="progress"></div>
</div>

<div class="stats">

<div class="stat">
    <div class="statLabel">Required Total Profit</div>
    <div class="statValue" id="requiredTotal">$0</div>
</div>

<div class="stat">
    <div class="statLabel">Additional Profit Needed</div>
    <div class="statValue" id="neededProfit">$0</div>
</div>

<div class="stat">
    <div class="statLabel">Estimated Days Needed</div>
    <div class="statValue" id="daysNeeded">0</div>
</div>

</div>

<div class="footer">
Built for traders by <strong>NQTRT</strong>
</div>

</div>

</div>

</div>

<script>

const totalProfit = document.getElementById("totalProfit");
const largestDay = document.getElementById("largestDay");
const target = document.getElementById("target");
const dailyProfit = document.getElementById("dailyProfit");

const percent = document.getElementById("percent");
const progress = document.getElementById("progress");

const requiredTotal = document.getElementById("requiredTotal");
const neededProfit = document.getElementById("neededProfit");
const daysNeeded = document.getElementById("daysNeeded");

const statusBox = document.getElementById("status");
const targetLine = document.getElementById("targetLine");

function calculate(){

    const total = parseFloat(totalProfit.value) || 0;
    const largest = parseFloat(largestDay.value) || 0;
    const targetPercent = parseFloat(target.value) || 20;
    const daily = parseFloat(dailyProfit.value) || 0;

    if(total <= 0 || largest <= 0){

        percent.innerHTML = "0%";
        progress.style.width = "0%";

        requiredTotal.innerHTML = "$0";
        neededProfit.innerHTML = "$0";
        daysNeeded.innerHTML = "0";

        return;
    }

    const consistency = (largest / total) * 100;

    percent.innerHTML = consistency.toFixed(2) + "%";

    progress.style.width = Math.min(consistency,100) + "%";

    targetLine.style.left = targetPercent + "%";

    const required = largest / (targetPercent / 100);

    const needed = Math.max(required - total,0);

    const days = daily > 0
    ? Math.ceil(needed / daily)
    : 0;

    requiredTotal.innerHTML =
    "$" + required.toFixed(0);

    neededProfit.innerHTML =
    "$" + needed.toFixed(0);

    daysNeeded.innerHTML = days;

    if(consistency <= targetPercent){

        statusBox.innerHTML = "PASSING";
        statusBox.classList.remove("fail");
        statusBox.classList.add("pass");

    }else{

        statusBox.innerHTML = "NOT PASSING";
        statusBox.classList.remove("pass");
        statusBox.classList.add("fail");

    }

}

totalProfit.addEventListener("input",calculate);
largestDay.addEventListener("input",calculate);
target.addEventListener("input",calculate);
dailyProfit.addEventListener("input",calculate);

</script>

</body>
</html>
